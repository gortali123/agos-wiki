      - name: CD_SCORE_CRIF_UC
        data_type: NUMBER(9,0)
      - name: CD_SCORE_CRIF_COOBLIGATO_UC
        data_type: NUMBER(9,0)
      - name: NM_PRATICHE
        data_type: NUMBER(9,0)
      - name: NM_PROTESTI
