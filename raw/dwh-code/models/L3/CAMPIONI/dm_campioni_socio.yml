        data_type: NUMBER(16,0)
      - name: NM_PRATICHE_COOB
        data_type: NUMBER(16,0)
      - name: NM_PRAT_ACC_CONS
        data_type: NUMBER(16,0)
      - name: NM_PRAT_RES_CONS
        data_type: NUMBER(16,0)
