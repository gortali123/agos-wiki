version: 2
models:
  - name: dm_acc_ca_target_m

    description: "DM_45 - Target Campioni Accettazione CA: impagati worst per offset mensile"
    config:
      materialized: incremental
      incremental_strategy: append
    constraints:
      - type: primary_key
        warn_unenforced: false
        columns: [CD_PRATICA, TP_PROCEDURA, DT_OSSERVAZIONE]
    columns:
      # FIX: il data model dichiara CD_PRATICA VARCHAR(10); il DDL L2 e' NUMBER(16,0)
      - name: CD_PRATICA
        data_type: NUMBER(16,0)
        description: "Codice pratica"
      - name: TP_PROCEDURA
        data_type: CHAR(2)
        description: "Tipo procedura"
      - name: DT_OSSERVAZIONE
        data_type: DATE
        description: "Data osservazione"
      - name: CD_CLIENTE
        data_type: NUMBER(9,0)
        description: "Codice cliente"
      - name: CD_STATO
        data_type: VARCHAR(2)
        description: "Codice stato pratica"
      - name: FL_PERDITA_CESSIONE
        data_type: CHAR(1)
        description: "Flag di perdita/cessione"
      - name: DT_CARICAMENTO
        data_type: DATE
        description: "Data caricamento (max fra dt_inse e dt_variazione)"
      - name: DT_CHIUSURA
        data_type: DATE
        description: "Data chiusura della carta"
      - name: DT_PRIMO_MOV_REGISTR
        data_type: DATE
        description: "Data primo acquisto"
      - name: DT_DBT
        data_type: DATE
        description: "Data di DBT"
      - name: DT_PERDITA
        data_type: DATE
        description: "Data di perdita"
      - name: DT_CESSIONE
        data_type: DATE
        description: "Data di cessione"
      - name: DT_PRIMA_SCAD
        data_type: DATE
        description: "Data di scadenza della prima rata"
      - name: NM_WORST0
        data_type: NUMBER(10,0)
        description: "Numero di impagati worst (esclusi accodamenti) al mese 0 dopo DT_DECORRENZA"
