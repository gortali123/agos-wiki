version: 2
models:
  - name: operazioni_cambiale
    config:
      materialized: incremental
      incremental_strategy: insert_overwrite
      query_tag: '{"app": "DBT", "schema": "L2_PAGAMENTI_E_CONTABILITA", "entita": "OPERAZIONI_CAMBIALE"}'
      # WARN: FL_SPESE_PRES / EFEXCDE_FL_SP_PRES NON e' colonna della sorgente main EFEXFEDPS
      #       (deriva da EFEXFINCDE): la delete_l2 sotto va verificata perche' matcha la PK sul main.
    constraints:
      - type: primary_key
        warn_unenforced: false
        columns: [TP_PROCEDURA, CD_PRATICA, DT_SCADENZA_TITOLO, CD_OPERAZIONE, CD_CAMBIALE]
    columns:
      - name: TP_PROCEDURA
        data_type: VARCHAR(2)
      - name: CD_PRATICA
        data_type: NUMBER(12)
      - name: DT_SCADENZA_TITOLO
        data_type: DATE
      - name: CD_OPERAZIONE
        data_type: VARCHAR(3)
      - name: CD_CAMBIALE
        data_type: NUMBER(12)
      - name: CD_ESITO_OCS
        data_type: VARCHAR(2)
      - name: CD_ESITO_OPERAZIONE
        data_type: NUMBER(2)
      - name: CD_STATO_TITOLO
        data_type: NUMBER(2)
      - name: CD_MARCATURA
        data_type: NUMBER(10)
      - name: CD_LOTTO_DOWNLOAD_T
        data_type: NUMBER(13)
      - name: CD_LOTTO_DOWNLOAD_D
        data_type: NUMBER(13)
      - name: TS_DOWNLOAD
        data_type: TIMESTAMP_NTZ
      - name: CD_LOTTO_UPLOAD_T
        data_type: NUMBER(13)
      - name: CD_LOTTO_UPLOAD_D
        data_type: NUMBER(13)
      - name: TS_UPLOAD
        data_type: TIMESTAMP_NTZ
      - name: FL_SPESE_PRES
        data_type: VARCHAR(1)