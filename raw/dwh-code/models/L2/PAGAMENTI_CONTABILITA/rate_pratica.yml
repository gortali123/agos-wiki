      - name: DT_INIZIO_VALIDITA
        data_type: DATE
      - name: DT_FINE_VALIDITA
        data_type: DATE
      - name: NM_RATA
        data_type: NUMBER(3)
      - name: NM_RATA_ORIG
        data_type: NUMBER(3)
      - name: TP_RATA
        data_type: VARCHAR(1)
      - name: DT_SCADENZA
        data_type: DATE
      - name: EU_IMPORTO_RATA_TOT
        data_type: NUMBER(16,2)
      - name: EU_COMP_FIN
        data_type: NUMBER(13,2)
