# =============================================================================
# L2 - PAGAMENTI E CONTABILITA - RATE_PRATICA - S4 (incremental / insert_overwrite)
# Colonne e ordine allineati all'output del SELECT finale del .sql.
#
# WARN PK vs grain: il GROUP BY del SQL include 'evento' (non emesso). La PK qui
#   dichiarata a 5 colonne potrebbe NON essere univoca se, a parita' di 5 chiavi,
#   coesistono piu' eventi. Verificare/aggiungere l'evento alla grain se serve.
# WARN pre_hook delete_l2: main cluster A2 -> incluso, ma la main e' un UNION
#   (OXCTFPAFD + OXCTFPAFA) con lookup OXCTFPAFT: agganciato solo a OXCTFPAFD e
#   potenzialmente ridondante con insert_overwrite. DA CONFERMARE.
# WARN query_tag: schema L2_PAGAMENTI_E_CONTABILITA -> adeguare al codice area
#   funzionale reale se diverso.
# =============================================================================
version: 2
models:
  - name: rate_pratica
    config:
      materialized: incremental
      incremental_strategy: insert_overwrite
      query_tag: '{"app": "DBT", "schema": "L2_PAGAMENTI_E_CONTABILITA", "entita": "RATE_PRATICA"}'
    
    constraints:
      - type: primary_key
        warn_unenforced: false
        columns: [TP_PROCEDURA, CD_PRATICA, NM_PROG_RATA, DT_INIZIO_VALIDITA, DT_FINE_VALIDITA]
    columns:
      - name: TP_PROCEDURA
        data_type: VARCHAR(2)
      - name: CD_PRATICA
        data_type: NUMBER(16)
      - name: DS_COMPONENTI_PIANO
