version: 2
models:
  - name: incassi_bollettini
    config:
      materialized: incremental
      incremental_strategy: insert_overwrite
      query_tag: '{"app": "DBT", "schema": "L2_PAGAMENTI_CONTABILITA", "entita": "INCASSI_BOLLETTINI"}'
    constraints:
      - type: primary_key
        warn_unenforced: false
        columns: [CD_CIRCUITO, CD_CCP, CD_CUAS, DT_ALLIBRAMENTO, TP_RECORD, PR_BOLLETTINO]
    columns:
      - name: CD_CIRCUITO
        data_type: VARCHAR(1)
      - name: CD_CCP
        data_type: NUMBER(3)
      - name: CD_CUAS
        data_type: VARCHAR(1)
      - name: DT_ALLIBRAMENTO
        data_type: DATE
      - name: TP_RECORD
        data_type: VARCHAR(1)
      - name: PR_BOLLETTINO
        data_type: NUMBER(7)
      - name: TP_BOLLETTINO
        data_type: VARCHAR(1)
      - name: CD_BOLLETTINO
        data_type: VARCHAR(3)
      - name: TP_PROCEDURA
        data_type: VARCHAR(2)
      - name: CD_PRATICA
        data_type: NUMBER(12)
      - name: CD_UTENZA_ALLIN
        data_type: VARCHAR(10)
      - name: NM_RATA
        data_type: NUMBER(3)
      - name: CD_CONTO_CORRENTE
        data_type: NUMBER(12)
      - name: CD_PROGR_SELEZIONE
        data_type: NUMBER(7)
      - name: DT_REGISTRAZIONE
        data_type: DATE
      - name: DT_OPERAZIONE_BOLLETTINO
        data_type: DATE
      - name: DT_ELABORAZ_NASTRO
        data_type: DATE
      - name: EU_IMPORTO
        data_type: NUMBER(11,2)