version: 2
models:
  - name: pacchetti_flessibilita
    config:
      materialized: incremental
      incremental_strategy: merge
      unique_key: [CD_PRATICA, TP_PROCEDURA, CD_AZIONE_POSTVENDITA, CD_CAMPAGNA, NM_PROGRESSIVO, TS_INIZIO_VALIDITA]
      query_tag: '{"app": "DBT", "schema": "L2_CAMPAGNE", "entita": "PACCHETTI_FLESSIBILITA"}'
    constraints:
      - type: primary_key
        warn_unenforced: false
        columns: [CD_PRATICA, TP_PROCEDURA, CD_AZIONE_POSTVENDITA, CD_CAMPAGNA, NM_PROGRESSIVO, TS_INIZIO_VALIDITA]
    columns:
      - name: CD_PRATICA
        data_type: NUMBER(12,0)
      - name: TP_PROCEDURA
        data_type: VARCHAR(2)
      - name: CD_AZIONE_POSTVENDITA
        data_type: VARCHAR(3)
      - name: CD_CAMPAGNA
        data_type: VARCHAR(5)
      - name: NM_PROGRESSIVO
        data_type: NUMBER(5,0)
      - name: TS_INIZIO_VALIDITA
        data_type: TIMESTAMP_NTZ
      - name: TS_FINE_VALIDITA
        data_type: TIMESTAMP_NTZ
      - name: TS_INSERIMENTO
        data_type: TIMESTAMP_NTZ
      - name: DT_INIZIO_VALIDITA
        data_type: DATE
      - name: DT_FINE_VALIDITA
        data_type: DATE
      - name: CD_STATO_CAMPAGNA
        data_type: VARCHAR(1)
      - name: FL_ANNULLAMENTO_MANUALE
        data_type: VARCHAR(1)
      - name: TS_ANNULLAMENTO
        data_type: TIMESTAMP_NTZ
      - name: CD_UTENTE_ANNULLAMENTO
        data_type: VARCHAR(10)
      - name: CD_UTENTE_INSERIMENTO
        data_type: VARCHAR(10)
      - name: CD_LIBRERIA_PROGRAMMA_ULTIMO
        data_type: VARCHAR(10)
      - name: CD_PROGRAMMA_ULTIMO
        data_type: VARCHAR(10)
      - name: CD_LIBRERIA_PROGRAMMA_PRECEDENTE
        data_type: VARCHAR(10)
      - name: CD_PROGRAMMA_PRECEDENTE
        data_type: VARCHAR(10)
      - name: LASTMODIFIEDDATA
        data_type: TIMESTAMP_NTZ
