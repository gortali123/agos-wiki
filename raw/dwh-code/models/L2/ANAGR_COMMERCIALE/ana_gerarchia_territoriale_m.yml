version: 2
models:
  - name: ana_gerarchia_territoriale_m
    config:
      materialized: incremental
      incremental_strategy: append
      query_tag: '{"app": "DBT", "schema": "L2_ANAGR_COMMERCIALE", "entita": "ANA_GERARCHIA_TERRITORIALE_M"}'
      pre_hook: "{{ delete_dt_osservazione() }}"
    constraints:
      - type: primary_key
        warn_unenforced: false
        columns: [CD_GER_TERRITORIALE_1, DT_OSSERVAZIONE]
        #columns: [DS_NODO_FOGLIA, DT_OSSERVAZIONE]
    columns:
      - name: DT_OSSERVAZIONE
        data_type: DATE
      - name: CD_GER_TERRITORIALE_1
        data_type: VARCHAR(10)
      - name: DS_GER_TERRITORIALE_1
        data_type: VARCHAR(50)
      - name: CD_GER_TERRITORIALE_2
        data_type: VARCHAR(10)
      - name: DS_GER_TERRITORIALE_2
        data_type: VARCHAR(50)
      - name: CD_GER_TERRITORIALE_3
        data_type: VARCHAR(10)
      - name: DS_GER_TERRITORIALE_3
        data_type: VARCHAR(50)
      - name: CD_GER_TERRITORIALE_4
        data_type: VARCHAR(10)
      - name: DS_GER_TERRITORIALE_4
        data_type: VARCHAR(50)
      - name: CD_NODO_FOGLIA
        data_type: VARCHAR(10)
      - name: DS_NODO_FOGLIA
        data_type: VARCHAR(50)
      - name: LASTMODIFIEDDATA
        data_type: TIMESTAMP_NTZ