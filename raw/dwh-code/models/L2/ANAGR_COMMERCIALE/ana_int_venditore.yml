version: 2
models:
  - name: ana_int_venditore
    config:
      materialized: incremental
      incremental_strategy: merge
      unique_key: [CD_INTERMEDIARIO, TP_INTERMEDIARIO, TP_PROCEDURA, TS_INIZIO_VALIDITA, PR_PK]
      query_tag: '{"app": "DBT", "schema": "L2_ANAGR_COMMERCIALE", "entita": "ANA_RESPONSABILI"}'
      pre_hook: "{{ delete_l2('ccintlve', ['CD_INTERMEDIARIO', 'TP_INTERMEDIARIO', 'TP_PROCEDURA'], ['INTLVE_INTERM', 'INTLVE_TIPO_INTERM', 'INTLVE_PROCEDURA']) }}"
    constraints:
      - type: primary_key
        columns: [CD_INTERMEDIARIO, TP_INTERMEDIARIO, TP_PROCEDURA, TS_INIZIO_VALIDITA, PR_PK]
    columns:
      - name: CD_INTERMEDIARIO
        data_type: NUMBER(9,0)
      - name: TP_INTERMEDIARIO
        data_type: VARCHAR(2)
      - name: TP_PROCEDURA
        data_type: VARCHAR(2)
      - name: TS_INIZIO_VALIDITA
        data_type: TIMESTAMP_NTZ
      - name: TS_FINE_VALIDITA
        data_type: TIMESTAMP_NTZ
      - name: PR_PK
        data_type: NUMBER(38,0)
      - name: DT_INIZIO_RAPPORTO
        data_type: DATE
      - name: CD_CAUSALE_ANNULLO
        data_type: VARCHAR(3)
      - name: CD_CONVENZIONATO_PV
        data_type: NUMBER(9,0)
      - name: CD_AGENTE_SA
        data_type: NUMBER(9,0)
      - name: FL_MULTI_CONVENZIONATO
        data_type: VARCHAR(1)
      - name: LASTMODIFIEDDATA
        data_type: TIMESTAMP_NTZ