version: 2
models:
  - name: ana_int_punto_vendita
    config:
      materialized: incremental
      incremental_strategy: merge
      unique_key: [CD_INTERMEDIARIO, TP_INTERMEDIARIO, TP_PROCEDURA, TS_INIZIO_VALIDITA, PR_PK]
      query_tag: '{"app": "DBT", "schema": "L2_ANAGR_COMMERCIALE", "entita": "ANA_INT_PUNTO_VENDITA"}'
      pre_hook: "{{ delete_l2('ccintlpv', ['CD_INTERMEDIARIO', 'TP_INTERMEDIARIO', 'TP_PROCEDURA'], ['INTLPV_INTERM', 'INTLPV_TIPO_INTERM', 'INTLPV_PROCEDURA']) }}"
    constraints:
      - type: primary_key
        columns: [CD_INTERMEDIARIO, TP_INTERMEDIARIO, TP_PROCEDURA, TS_INIZIO_VALIDITA, PR_PK]
    columns:
      - name: CD_INTERMEDIARIO
        data_type: NUMBER(9,0)
      - name: TP_INTERMEDIARIO
        data_type: VARCHAR(2)
      - name: TP_PROCEDURA
        data_type: VARCHAR(2)
      - name: TS_INIZIO_VALIDITA
        data_type: TIMESTAMP_NTZ
      - name: TS_FINE_VALIDITA
        data_type: TIMESTAMP_NTZ
      - name: PR_PK
        data_type: NUMBER(38,0)
      - name: NM_ANNO_INIZIO
        data_type: NUMBER(4,0)
      - name: DT_INIZIO_CONV
        data_type: DATE
      - name: CD_CAUSALE_ANNULLO
        data_type: VARCHAR(3)
      - name: CD_CONVENZIONATO
        data_type: NUMBER(9,0)
      - name: CD_AGENTE
        data_type: NUMBER(9,0)
      - name: CD_RESPONSABILE
        data_type: VARCHAR(8)
      - name: FL_GESTIONE_VE
        data_type: VARCHAR(1)
      - name: FL_GESTIONE_VE_AGG
        data_type: VARCHAR(1)
      - name: CD_SETTORE_MERC
        data_type: VARCHAR(5)
      - name: DS_INSEGNA
        data_type: VARCHAR(30)
      - name: CD_FATT_CONTRIBUTI
        data_type: VARCHAR(1)
      - name: EU_PLAFOND
        data_type: NUMBER(15,2)
      - name: EU_VOLUME_AFFARI
        data_type: NUMBER(15,2)
      - name: LASTMODIFIEDDATA
        data_type: TIMESTAMP_NTZ