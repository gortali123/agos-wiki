version: 2
models:
  - name: ana_intermediari_base
    config:
      materialized: incremental
      incremental_strategy: merge
      unique_key: [CD_INTERMEDIARIO, TP_INTERMEDIARIO, TP_PROCEDURA, TS_INIZIO_VALIDITA, PR_PK]
      query_tag: '{"app": "DBT", "schema": "L2_ANAGR_COMMERCIALE", "entita": "ANA_INTERMEDIARI_BASE"}'
      pre_hook: "{{ delete_l2('ccintlin', ['CD_INTERMEDIARIO', 'TP_INTERMEDIARIO', 'TP_PROCEDURA'], ['INTLIN_INTERM', 'INTLIN_TIPO_INTERM', 'INTLIN_PROCEDURA']) }}"
    constraints:
      - type: primary_key
        warn_unenforced: false
        columns: [CD_INTERMEDIARIO, TP_INTERMEDIARIO, TP_PROCEDURA, TS_INIZIO_VALIDITA, PR_PK]
    columns:
