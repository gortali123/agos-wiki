version: 2
models:
  - name: plan_chargeprof
    config:
      materialized: incremental
      incremental_strategy: merge
      unique_key: [CD_PRATICA, CD_PIANO, NM_START, TP_CALCOLO, TS_INIZIO_VALIDITA]
      query_tag: '{"app": "DBT", "schema": "L2_SWORD", "entita": "PLAN_CHARGEPROF"}'
      post_hook:
        # Chiusura per assenza (SCD2). Livelli: CreditLine -> Plans/Plan -> ChargingProfile (no wrapper).
        # PK con 2 campi dentro ChargingProfile: NM_START e TP_CALCOLO (quest'ultimo COALESCE ->'ND').
        - >
          {{ chiudi_finestre_scd2_sword(
               source_name='master_data',
               root_path='OrganisationId/OrganisationReference',
               levels=[
                 {'wrapper': 'CreditLines', 'node': 'CreditLine',
                  'keys': [{'name': 'CD_PRATICA', 'path': 'CreditLineReference', 'type': 'VARCHAR(17)'}]},
                 {'wrapper': 'Plans', 'node': 'Plan',
                  'keys': [{'name': 'CD_PIANO', 'path': 'PlanReference', 'type': 'VARCHAR(30)'}]},
                 {'node': 'ChargingProfile',
                  'keys': [
                    {'name': 'NM_START', 'path': 'ChargingTimings/Start/Day', 'type': 'NUMBER'},
                    {'name': 'TP_CALCOLO', 'path': 'ChargingTimings/CalculationType', 'type': 'VARCHAR(7)', 'coalesce': "'ND'"}
                  ]}
               ]
             ) }}
    constraints:
      - type: primary_key
        warn_unenforced: false
        columns: [CD_PRATICA, CD_PIANO, NM_START, TP_CALCOLO, TS_INIZIO_VALIDITA]
    columns:
      - name: CD_PRATICA
        data_type: VARCHAR(17)
      - name: CD_PIANO
        data_type: VARCHAR(30)
      - name: NM_START
        data_type: NUMBER
      - name: TP_CALCOLO
        data_type: VARCHAR(7)
      - name: TS_INIZIO_VALIDITA
        data_type: TIMESTAMP_NTZ
      - name: TS_FINE_VALIDITA
        data_type: TIMESTAMP_NTZ
      - name: CD_CLIENTE
        data_type: NUMBER(10,0)
      - name: NM_END
        data_type: NUMBER
      - name: CD_PAGATORE
        data_type: VARCHAR(6)
      - name: TP_INTERESSE_BASE
        data_type: VARCHAR(7)
      - name: NM_INTERESSE
        data_type: NUMBER(5,3)
      - name: NM_VARIANZA_INTSS_PIA
        data_type: NUMBER(5,3)
      - name: NM_VARIANZA_INTSS_CLI
        data_type: NUMBER(5,3)
      - name: LASTMODIFIEDDATA
        data_type: TIMESTAMP_NTZ
