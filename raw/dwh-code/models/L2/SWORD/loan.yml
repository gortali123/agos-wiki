version: 2
models:
  - name: loan
    config:
      materialized: incremental
      incremental_strategy: merge
      unique_key: [CD_PRATICA, CD_PIANO, CD_CERTIFICATO, TS_INIZIO_VALIDITA]
      query_tag: '{"app": "DBT", "schema": "L2_SWORD", "entita": "LOAN"}'
      post_hook:
        # Chiusura per assenza (SCD2). Chiave su 4 livelli: CreditLine -> Plans/Plan -> Loans/Loan.
        - >
          {{ chiudi_finestre_scd2_sword(
               source_name='master_data',
               root_path='OrganisationId/OrganisationReference',
               levels=[
                 {'wrapper': 'CreditLines', 'node': 'CreditLine',
                  'keys': [{'name': 'CD_PRATICA', 'path': 'CreditLineReference', 'type': 'VARCHAR(17)'}]},
                 {'wrapper': 'Plans', 'node': 'Plan',
                  'keys': [{'name': 'CD_PIANO', 'path': 'PlanReference', 'type': 'VARCHAR(30)'}]},
                 {'wrapper': 'Loans', 'node': 'Loan',
                  'keys': [{'name': 'CD_CERTIFICATO', 'path': 'LoanID', 'type': 'NUMBER(8,0)'}]}
               ]
             ) }}
    constraints:
      - type: primary_key
        warn_unenforced: false
        columns: [CD_PRATICA, CD_PIANO, CD_CERTIFICATO, TS_INIZIO_VALIDITA]
    columns:
      - name: CD_PRATICA
        data_type: VARCHAR(17)
      - name: CD_PIANO
        data_type: VARCHAR(30)
      - name: CD_CERTIFICATO
        data_type: NUMBER(8,0)
      - name: TS_INIZIO_VALIDITA
        data_type: TIMESTAMP_NTZ
      - name: TS_FINE_VALIDITA
        data_type: TIMESTAMP_NTZ
      - name: CD_CLIENTE
        data_type: NUMBER(10,0)
      - name: CD_STATO_CERTIF
        data_type: VARCHAR(12)
      - name: CD_PAYMENT_STATUS
        data_type: VARCHAR(7)
      - name: CD_REGION
        data_type: VARCHAR(2)
      - name: FL_RISTRUTTURAZIONE
        data_type: VARCHAR(5)
      - name: DT_INIZIO_CALC_INTSSI
        data_type: DATE
      - name: DT_SCADENZA_CONTR
        data_type: DATE
      - name: DT_RIMBORSO
        data_type: DATE
      - name: DT_STATO_CERTIF
        data_type: DATE
      - name: EU_ORIGINARIO_VEIC
        data_type: NUMBER(13,2)
      - name: EU_IMPORTO_CORR
        data_type: NUMBER(13,2)
      - name: EU_UTILIZZATO
        data_type: NUMBER(13,2)
      - name: LASTMODIFIEDDATA
        data_type: TIMESTAMP_NTZ
