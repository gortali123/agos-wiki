version: 2
models:
  - name: loan_chargeprof
    config:
      materialized: incremental
      incremental_strategy: merge
      unique_key: [CD_PRATICA, CD_PIANO, CD_CERTIFICATO, DT_START, TS_INIZIO_VALIDITA]
      query_tag: '{"app": "DBT", "schema": "L2_SWORD", "entita": "LOAN_CHARGEPROF"}'
      post_hook:
        # Chiusura per assenza (SCD2). Chiave su 5 livelli:
        #   CreditLine -> Plans/Plan -> Loans/Loan -> ChargingProfile (senza wrapper).
        #   DT_START (dentro ChargingProfile) fa parte della chiave.
        - >
          {{ chiudi_finestre_scd2_sword(
               source_name='master_data',
               root_path='OrganisationId/OrganisationReference',
               levels=[
                 {'wrapper': 'CreditLines', 'node': 'CreditLine',
                  'keys': [{'name': 'CD_PRATICA', 'path': 'CreditLineReference', 'type': 'VARCHAR(17)'}]},
                 {'wrapper': 'Plans', 'node': 'Plan',
                  'keys': [{'name': 'CD_PIANO', 'path': 'PlanReference', 'type': 'VARCHAR(30)'}]},
                 {'wrapper': 'Loans', 'node': 'Loan',
                  'keys': [{'name': 'CD_CERTIFICATO', 'path': 'LoanID', 'type': 'NUMBER(8,0)'}]},
                 {'node': 'ChargingProfile',
                  'keys': [{'name': 'DT_START', 'path': 'ChargingTimings/Start/Date', 'type': 'DATE'}]}
               ]
             ) }}
    constraints:
      - type: primary_key
        warn_unenforced: false
        columns: [CD_PRATICA, CD_PIANO, CD_CERTIFICATO, DT_START, TS_INIZIO_VALIDITA]
    columns:
      - name: CD_PRATICA
        data_type: VARCHAR(17)
      - name: CD_PIANO
        data_type: VARCHAR(30)
      - name: CD_CERTIFICATO
        data_type: NUMBER(8,0)
      - name: DT_START
        data_type: DATE
      - name: TS_INIZIO_VALIDITA
        data_type: TIMESTAMP_NTZ
      - name: TS_FINE_VALIDITA
        data_type: TIMESTAMP_NTZ
      - name: CD_CLIENTE
        data_type: NUMBER(10,0)
      - name: CD_PAGATORE
        data_type: VARCHAR(6)
      - name: TP_INTERESSE_BASE
        data_type: VARCHAR(7)
      - name: PC_TASSO_BSE
        data_type: NUMBER(5,4)
      - name: NM_SPREAD_PIAN
        data_type: NUMBER(5,4)
      - name: NM_SPREAD_DLR
        data_type: NUMBER(5,4)
      - name: TP_CALCOLO
        data_type: VARCHAR(7)
      - name: DT_END
        data_type: DATE
      - name: LASTMODIFIEDDATA
        data_type: TIMESTAMP_NTZ
