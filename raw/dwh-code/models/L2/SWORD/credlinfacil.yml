version: 2
models:
  - name: credlinfacil
    config:
      materialized: incremental
      incremental_strategy: merge
      unique_key: [CD_PRATICA, TP_FACILITY, TS_INIZIO_VALIDITA]
      query_tag: '{"app": "DBT", "schema": "L2_SWORD", "entita": "CREDLINFACIL"}'
      post_hook:
        # Chiusura per assenza (SCD2). CreditLine -> CreditLineFacilities/Facility (foglia=testo nodo).
        - >
          {{ chiudi_finestre_scd2_sword(
               source_name='master_data',
               root_path='OrganisationId/OrganisationReference',
               levels=[
                 {'wrapper': 'CreditLines', 'node': 'CreditLine',
                  'keys': [{'name': 'CD_PRATICA', 'path': 'CreditLineReference', 'type': 'VARCHAR(25)'}]},
                 {'wrapper': 'CreditLineFacilities', 'node': 'Facility',
                  'keys': [{'name': 'TP_FACILITY', 'type': 'VARCHAR(25)'}]}
               ]
             ) }}
    constraints:
      - type: primary_key
        warn_unenforced: false
        columns: [CD_PRATICA, TP_FACILITY, TS_INIZIO_VALIDITA]
    columns:
      - name: CD_PRATICA
        data_type: VARCHAR(25)
      - name: TP_FACILITY
        data_type: VARCHAR(25)
      - name: TS_INIZIO_VALIDITA
        data_type: TIMESTAMP_NTZ
      - name: TS_FINE_VALIDITA
        data_type: TIMESTAMP_NTZ
      - name: CD_CLIENTE
        data_type: NUMBER(10,0)
      - name: LASTMODIFIEDDATA
        data_type: TIMESTAMP_NTZ