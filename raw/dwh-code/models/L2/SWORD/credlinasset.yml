version: 2
models:
  - name: credlinasset
    config:
      materialized: incremental
      incremental_strategy: merge
      unique_key: [CD_PRATICA, TP_VEICOLO, TS_INIZIO_VALIDITA]
      query_tag: '{"app": "DBT", "schema": "L2_SWORD", "entita": "CREDLINASSET"}'
      post_hook:
        # Chiusura per assenza (SCD2). CreditLine -> CreditLineAssetTypes/AssetType (foglia=testo nodo).
        - >
          {{ chiudi_finestre_scd2_sword(
               source_name='master_data',
               root_path='OrganisationId/OrganisationReference',
               levels=[
                 {'wrapper': 'CreditLines', 'node': 'CreditLine',
                  'keys': [{'name': 'CD_PRATICA', 'path': 'CreditLineReference', 'type': 'VARCHAR(30)'}]},
                 {'wrapper': 'CreditLineAssetTypes', 'node': 'AssetType',
                  'keys': [{'name': 'TP_VEICOLO', 'type': 'VARCHAR(15)'}]}
               ]
             ) }}
    constraints:
      - type: primary_key
        warn_unenforced: false
        columns: [CD_PRATICA, TP_VEICOLO, TS_INIZIO_VALIDITA]
    columns:
      - name: CD_PRATICA
        data_type: VARCHAR(30)
      - name: TP_VEICOLO
        data_type: VARCHAR(15)
      - name: TS_INIZIO_VALIDITA
        data_type: TIMESTAMP_NTZ
      - name: TS_FINE_VALIDITA
        data_type: TIMESTAMP_NTZ
      - name: CD_CLIENTE
        data_type: NUMBER(10,0)
      - name: LASTMODIFIEDDATA
        data_type: TIMESTAMP_NTZ