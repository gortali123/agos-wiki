version: 2

models:
  - name: oxctftasr_m
    config:
      materialized: incremental
      incremental_strategy: append
      pre_hook:
        - "{{ delete_dt_osservazione() }}"
      meta:
        cluster: ["D"]
      query_tag: '{"app":"DBT", "sorgente":"OCS", "schema":"L1_O_CH2", "archivio":"OXCTFTASR_M"}'
    constraints:
      - type: primary_key
        warn_unenforced: false
        columns: [oxcttasr_procedura, oxcttasr_num_pratica, oxcttasr_cod_rendimento, dt_osservazione]
    columns:
      - name: ts_riferimento
        data_type: TIMESTAMP_NTZ
      - name: ts_caricamento
        data_type: TIMESTAMP_NTZ
      - name: sys_change_operation
        data_type: VARCHAR
      - name: lastmodifieddata
        data_type: TIMESTAMP_NTZ
      - name: dt_osservazione
        data_type: DATE
      - name: oxcttasr_procedura
        data_type: VARCHAR(2)
      - name: oxcttasr_num_pratica
        data_type: NUMBER(12,0)
      - name: oxcttasr_cod_rendimento
        data_type: VARCHAR(3)
      - name: oxcttasr_rend_nominale
        data_type: NUMBER(6,3)
      - name: oxcttasr_rend_effettivo
        data_type: NUMBER(6,3)
      - name: oxcttasr_finanziato
        data_type: NUMBER(13,0)
      - name: oxcttasr_oneri
        data_type: NUMBER(13,0)
      - name: oxcttasr_tipo_agg
        data_type: VARCHAR(1)
      - name: oxcttasr_data
        data_type: NUMBER(8,0)
      - name: oxcttasr_ora
        data_type: NUMBER(8,0)
      - name: oxcttasr_utente
        data_type: VARCHAR(10)
      - name: oxcttasr_funzione
        data_type: VARCHAR(2)
      - name: oxcttasr_progressivo
        data_type: NUMBER(3,0)
      - name: rowid
        data_type: NUMBER(38, 0)
