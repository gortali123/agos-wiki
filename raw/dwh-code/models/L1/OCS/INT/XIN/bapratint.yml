version: 2

models:
  - name: bapratint
    config:
      materialized: incremental
      incremental_strategy: insert_overwrite
      meta:
        cluster: ["B2"]
      query_tag: '{"app":"DBT", "sorgente":"OCS", "schema":"L1_O_XIN", "archivio":"BAPRATINT"}'
    constraints:
      - type: primary_key
        warn_unenforced: false
        columns: [baint_procedura, baint_pratica, baint_progressivo]
    columns:
      - name: ts_riferimento
        data_type: TIMESTAMP_NTZ
      - name: ts_caricamento
        data_type: TIMESTAMP_NTZ
      - name: sys_change_operation
        data_type: VARCHAR
      - name: lastmodifieddata
        data_type: TIMESTAMP_NTZ
      - name: baint_procedura
        data_type: VARCHAR(2)
      - name: baint_pratica
        data_type: NUMBER(12,0)
      - name: baint_progressivo
        data_type: NUMBER(3,0)
      - name: baint_rete_vendita
        data_type: NUMBER(9,0)
      - name: baint_agente
        data_type: NUMBER(9,0)
      - name: baint_sub_agente
        data_type: NUMBER(9,0)
      - name: baint_convenzionato
        data_type: NUMBER(9,0)
      - name: baint_punto_vendita
        data_type: NUMBER(9,0)
      - name: baint_venditore
        data_type: NUMBER(9,0)
      - name: baint_segnalatore
        data_type: NUMBER(12,0)
      - name: baint_brand
        data_type: VARCHAR(1)
      - name: rowid
        data_type: NUMBER(38, 0)
