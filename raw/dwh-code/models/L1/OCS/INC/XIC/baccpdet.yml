        data_type: VARCHAR(7)
      - name: bold_progres_acquisiz
        data_type: NUMBER(7,0)
      - name: bold_data_acquisiz
        data_type: NUMBER(8,0)
      - name: bold_data_registraz
        data_type: NUMBER(8,0)
      - name: bold_numeratore
        data_type: NUMBER(13,0)
      - name: bold_pratica_eff
        data_type: NUMBER(12,0)
      - name: bold_codice_bp
