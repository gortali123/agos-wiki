version: 2

models:
  - name: oxctffbp_m
    config:
      materialized: incremental
      incremental_strategy: append
      pre_hook:
        - "{{ delete_month(get_dt_osservazione('ts_riferimento')) }}"
      meta:
        cluster: ["D"]
      query_tag: '{"app":"DBT", "sorgente":"OCS", "schema":"L1_O_CH1", "archivio":"OXCTFFBP_M"}'
    constraints:
      - type: primary_key
        warn_unenforced: false
        columns: [oxctfbp_cliente, oxctfbp_progressivo, dt_osservazione]
    columns:
      - name: ts_riferimento
        data_type: TIMESTAMP_NTZ
      - name: ts_caricamento
        data_type: TIMESTAMP_NTZ
      - name: sys_change_operation
        data_type: VARCHAR
      - name: lastmodifieddata
        data_type: TIMESTAMP_NTZ
      - name: dt_osservazione
        data_type: DATE
      - name: oxctfbp_cliente
        data_type: NUMBER(9,0)
      - name: oxctfbp_progressivo
        data_type: NUMBER(5,0)
      - name: oxctfbp_data_inizio
        data_type: NUMBER(8,0)
      - name: oxctfbp_data_fine
        data_type: NUMBER(8,0)
      - name: oxctfbp_data_uscita
        data_type: NUMBER(8,0)
      - name: oxctfbp_data_annullo
        data_type: NUMBER(8,0)
      - name: oxctfbp_data
        data_type: NUMBER(8,0)
      - name: oxctfbp_ora
        data_type: NUMBER(8,0)
      - name: oxctfbp_utente
        data_type: VARCHAR(10)
      - name: oxctfbp_procedura
        data_type: VARCHAR(2)
      - name: oxctfbp_pratica
        data_type: NUMBER(12,0)
      - name: oxctfbp_progr_post
        data_type: NUMBER(11,0)
      - name: oxctfbp_data_riavvio
        data_type: NUMBER(8,0)
      - name: oxctfbp_gg_riavvio
        data_type: NUMBER(5,0)
      - name: oxctfbp_gg_scaduto
        data_type: NUMBER(5,0)
      - name: oxctfbp_imp_scaduto
        data_type: NUMBER(13,0)
      - name: oxctfbp_data_moratoria
        data_type: NUMBER(8,0)
      - name: oxctfbp_motivo_ingresso
        data_type: VARCHAR(3)
      - name: rowid
        data_type: NUMBER(38, 0)
