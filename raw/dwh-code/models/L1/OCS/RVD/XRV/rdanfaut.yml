version: 2

models:
  - name: rdanfaut
    config:
      materialized: incremental
      incremental_strategy: merge
      unique_key: ['anfaut_tipo_calcolo', 'anfaut_data_calcolo', 'anfaut_codice']
      post_hook: "{{ logic_delete_merge() }}"
      meta:
        cluster: ["A1"]
      query_tag: '{"app":"DBT", "sorgente":"OCS", "schema":"L1_O_XRV", "archivio":"RDANFAUT"}'
    constraints:
      - type: primary_key
        warn_unenforced: false
        columns: [anfaut_tipo_calcolo, anfaut_data_calcolo, anfaut_codice]
    columns:
      - name: ts_riferimento
        data_type: TIMESTAMP_NTZ
      - name: ts_caricamento
        data_type: TIMESTAMP_NTZ
      - name: fl_deleted
        data_type: VARCHAR(1)
      - name: ts_deleted
        data_type: TIMESTAMP_NTZ
      - name: sys_change_operation
        data_type: VARCHAR
      - name: lastmodifieddata
        data_type: TIMESTAMP_NTZ
      - name: anfaut_tipo_calcolo
        data_type: VARCHAR(1)
      - name: anfaut_data_calcolo
        data_type: NUMBER(8,0)
      - name: anfaut_codice
        data_type: NUMBER(7,0)
      - name: anfaut_fido_calcolato
        data_type: NUMBER(13,0)
      - name: anfaut_saldo_rilevato
        data_type: NUMBER(13,0)
      - name: anfaut_anticip_auto
        data_type: NUMBER(13,0)
      - name: anfaut_da_disattivare
        data_type: VARCHAR(1)
      - name: anfaut_da_effettuare
        data_type: VARCHAR(1)
      - name: anfaut_mod_reintegro
        data_type: VARCHAR(1)
      - name: rowid
        data_type: NUMBER(38, 0)
