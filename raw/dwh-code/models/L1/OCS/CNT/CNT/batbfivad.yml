version: 2

models:
  - name: batbfivad
    config:
      materialized: incremental
      incremental_strategy: merge
      unique_key: ['batbivad_data']
      post_hook: "{{ logic_delete_merge() }}"
      meta:
        cluster: ["A1"]
      query_tag: '{"app":"DBT", "sorgente":"OCS", "schema":"L1_O_CNT", "archivio":"BATBFIVAD"}'
    constraints:
      - type: primary_key
        warn_unenforced: false
        columns: [batbivad_data]
    columns:
      - name: ts_riferimento
        data_type: TIMESTAMP_NTZ
      - name: ts_caricamento
        data_type: TIMESTAMP_NTZ
      - name: fl_deleted
        data_type: VARCHAR(1)
      - name: ts_deleted
        data_type: TIMESTAMP_NTZ
      - name: sys_change_operation
        data_type: VARCHAR
      - name: lastmodifieddata
        data_type: TIMESTAMP_NTZ
      - name: batbivad_data
        data_type: NUMBER(8,0)
      - name: batbivad_codice_iva
        data_type: VARCHAR(2)
      - name: batbivad_codice_iva_pa
        data_type: VARCHAR(2)
      - name: rowid
        data_type: NUMBER(38, 0)
