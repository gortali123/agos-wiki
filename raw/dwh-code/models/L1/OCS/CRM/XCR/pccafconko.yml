version: 2

models:
  - name: pccafconko
    config:
      materialized: incremental
      incremental_strategy: merge
      unique_key: ['pccaconko_data', 'pccaconko_ora', 'pccaconko_tipo_batch', 'pccaconko_id_contatto', 'pccaconko_progressivo']
      post_hook: "{{ logic_delete_merge() }}"
      meta:
        cluster: ["A1"]
      query_tag: '{"app":"DBT", "sorgente":"OCS", "schema":"L1_O_XCR", "archivio":"PCCAFCONKO"}'
    constraints:
      - type: primary_key
        warn_unenforced: false
        columns: [pccaconko_data, pccaconko_ora, pccaconko_tipo_batch, pccaconko_id_contatto, pccaconko_progressivo]
    columns:
      - name: ts_riferimento
        data_type: TIMESTAMP_NTZ
      - name: ts_caricamento
        data_type: TIMESTAMP_NTZ
      - name: fl_deleted
        data_type: VARCHAR(1)
      - name: ts_deleted
        data_type: TIMESTAMP_NTZ
      - name: sys_change_operation
        data_type: VARCHAR
      - name: lastmodifieddata
        data_type: TIMESTAMP_NTZ
      - name: pccaconko_data
        data_type: NUMBER(8,0)
      - name: pccaconko_ora
        data_type: NUMBER(8,0)
      - name: pccaconko_tipo_batch
        data_type: VARCHAR(1)
      - name: pccaconko_id_contatto
        data_type: NUMBER(13,0)
      - name: pccaconko_progressivo
        data_type: NUMBER(9,0)
      - name: pccaconko_campo
        data_type: VARCHAR(20)
      - name: pccaconko_errore
        data_type: VARCHAR(90)
      - name: rowid
        data_type: NUMBER(38, 0)
