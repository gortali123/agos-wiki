version: 2

models:
  - name: ccanaaci
    config:
      materialized: incremental
      incremental_strategy: insert_overwrite
      meta:
        cluster: ["B1"]
      query_tag: '{"app":"DBT", "sorgente":"OCS", "schema":"L1_O_XAN", "archivio":"CCANAACI"}'
    constraints:
      - type: primary_key
        warn_unenforced: false
        columns: [anaaci_controparte, anaaci_tipo]
    columns:
      - name: ts_riferimento
        data_type: TIMESTAMP_NTZ
      - name: ts_caricamento
        data_type: TIMESTAMP_NTZ
      - name: sys_change_operation
        data_type: VARCHAR
      - name: lastmodifieddata
        data_type: TIMESTAMP_NTZ
      - name: anaaci_controparte
        data_type: NUMBER(9,0)
      - name: anaaci_tipo
        data_type: VARCHAR(3)
      - name: anaaci_contatto
        data_type: VARCHAR(256)
      - name: rowid
        data_type: NUMBER(38, 0)
