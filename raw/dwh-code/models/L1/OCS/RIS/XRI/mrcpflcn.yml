version: 2

models:
  - name: mrcpflcn
    config:
      materialized: incremental
      incremental_strategy: merge
      unique_key: ['mrcplcn_progressivo', 'mrcplcn_controparte']
      post_hook: "{{ logic_delete_merge() }}"
      meta:
        cluster: ["A2"]
      query_tag: '{"app":"DBT", "sorgente":"OCS", "schema":"L1_O_XRI", "archivio":"MRCPFLCN"}'
    constraints:
      - type: primary_key
        warn_unenforced: false
        columns: [mrcplcn_progressivo, mrcplcn_controparte]
    columns:
      - name: ts_riferimento
        data_type: TIMESTAMP_NTZ
      - name: ts_caricamento
        data_type: TIMESTAMP_NTZ
      - name: fl_deleted
        data_type: VARCHAR(1)
      - name: ts_deleted
        data_type: TIMESTAMP_NTZ
      - name: sys_change_operation
        data_type: VARCHAR
      - name: lastmodifieddata
        data_type: TIMESTAMP_NTZ
      - name: mrcplcn_progressivo
        data_type: NUMBER(9,0)
      - name: mrcplcn_controparte
        data_type: NUMBER(9,0)
      - name: mrcplcn_cod_anagrafico_ep
        data_type: VARCHAR(16)
      - name: rowid
        data_type: NUMBER(38, 0)
