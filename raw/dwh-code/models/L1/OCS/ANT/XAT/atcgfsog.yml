      - name: atcgsog_nas_cab_comune
        data_type: VARCHAR(5)
      - name: atcgsog_nas_nazione
        data_type: VARCHAR(3)
      - name: atcgsog_res_cab_comune
        data_type: VARCHAR(5)
      - name: atcgsog_res_nazione
        data_type: VARCHAR(3)
      - name: atcgsog_pep
        data_type: VARCHAR(1)
      - name: atcgsog_denominazione
        data_type: VARCHAR(40)
      - name: atcgsog_sed_cab_comune
        data_type: VARCHAR(5)
      - name: atcgsog_sed_nazione
        data_type: VARCHAR(3)
      - name: atcgsog_sae
        data_type: VARCHAR(3)
      - name: atcgsog_ateco
        data_type: VARCHAR(3)
      - name: atcgsog_data
        data_type: NUMBER(8,0)
