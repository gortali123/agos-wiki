version: 2

models:
  - name: atcgfsog
    config:
      materialized: incremental
      incremental_strategy: merge
      unique_key: ['atcgsog_progressivo', 'atcgsog_progr_sogg']
      post_hook: "{{ logic_delete_merge() }}"
      meta:
        cluster: ["A2"]
      query_tag: '{"app":"DBT", "sorgente":"OCS", "schema":"L1_O_XAT", "archivio":"ATCGFSOG"}'
    constraints:
      - type: primary_key
        warn_unenforced: false
        columns: [atcgsog_progressivo, atcgsog_progr_sogg]
    columns:
      - name: ts_riferimento
        data_type: TIMESTAMP_NTZ
      - name: ts_caricamento
        data_type: TIMESTAMP_NTZ
      - name: fl_deleted
        data_type: VARCHAR(1)
      - name: ts_deleted
        data_type: TIMESTAMP_NTZ
      - name: sys_change_operation
        data_type: VARCHAR
      - name: lastmodifieddata
        data_type: TIMESTAMP_NTZ
      - name: atcgsog_progressivo
        data_type: NUMBER(9,0)
      - name: atcgsog_progr_sogg
        data_type: NUMBER(2,0)
      - name: atcgsog_tipo_sogg
        data_type: NUMBER(2,0)
      - name: atcgsog_codice
        data_type: NUMBER(9,0)
      - name: atcgsog_natura_giuridica
        data_type: VARCHAR(3)
      - name: atcgsog_codice_fiscale
        data_type: VARCHAR(16)
      - name: atcgsog_nome
        data_type: VARCHAR(30)
      - name: atcgsog_cognome
        data_type: VARCHAR(30)
      - name: atcgsog_sesso
        data_type: VARCHAR(1)
