version: 2

models:
  - name: cngsfeaf
    config:
      materialized: incremental
      incremental_strategy: merge
      unique_key: ['cngseaf_progressivo', 'cngseaf_pagina', 'cngseaf_prg_account']
      post_hook: "{{ logic_delete_merge() }}"
      meta:
        cluster: ["A2"]
      query_tag: '{"app":"DBT", "sorgente":"OCS", "schema":"L1_O_CMN", "archivio":"CNGSFEAF"}'
    constraints:
      - type: primary_key
        warn_unenforced: false
        columns: [cngseaf_progressivo, cngseaf_pagina, cngseaf_prg_account]
    columns:
      - name: ts_riferimento
        data_type: TIMESTAMP_NTZ
      - name: ts_caricamento
        data_type: TIMESTAMP_NTZ
      - name: fl_deleted
        data_type: VARCHAR(1)
      - name: ts_deleted
        data_type: TIMESTAMP_NTZ
      - name: sys_change_operation
        data_type: VARCHAR
      - name: lastmodifieddata
        data_type: TIMESTAMP_NTZ
      - name: cngseaf_progressivo
        data_type: NUMBER(13,0)
      - name: cngseaf_pagina
        data_type: NUMBER(1,0)
      - name: cngseaf_prg_account
        data_type: NUMBER(13,0)
      - name: cngseaf_account
        data_type: VARCHAR(100)
      - name: rowid
        data_type: NUMBER(38, 0)
