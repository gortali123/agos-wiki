version: 2

models:
  - name: ccemllgd
    config:
      materialized: incremental
      incremental_strategy: merge
      unique_key: ['rowid']
      post_hook: "{{ logic_delete_merge() }}"
      meta:
        cluster: ["A2"]
      query_tag: '{"app":"DBT", "sorgente":"OCS", "schema":"L1_O_XCM", "archivio":"CCEMLLGD"}'
    constraints:
      - type: primary_key
        warn_unenforced: false
        columns: [rowid]
    columns:
      - name: ts_riferimento
        data_type: TIMESTAMP_NTZ
      - name: ts_caricamento
        data_type: TIMESTAMP_NTZ
      - name: fl_deleted
        data_type: VARCHAR(1)
      - name: ts_deleted
        data_type: TIMESTAMP_NTZ
      - name: sys_change_operation
        data_type: VARCHAR
      - name: lastmodifieddata
        data_type: TIMESTAMP_NTZ
      - name: emllgd_progressivo
        data_type: NUMBER(11,0)
      - name: emllgd_funzione
        data_type: VARCHAR(10)
      - name: emllgd_testo
        data_type: VARCHAR(200)
      - name: rowid
        data_type: NUMBER(38, 0)
