version: 2

models:
  - name: ccbiradd
    config:
      materialized: incremental
      incremental_strategy: merge
      unique_key: ['biradd_procedura', 'biradd_pratica', 'biradd_progressivo']
      post_hook: "{{ logic_delete_merge() }}"
      meta:
        cluster: ["A2"]
      query_tag: '{"app":"DBT", "sorgente":"OCS", "schema":"L1_O_XCO", "archivio":"CCBIRADD"}'
    constraints:
      - type: primary_key
        warn_unenforced: false
        columns: [biradd_procedura, biradd_pratica, biradd_progressivo]
    columns:
      - name: ts_riferimento
        data_type: TIMESTAMP_NTZ
      - name: ts_caricamento
        data_type: TIMESTAMP_NTZ
      - name: fl_deleted
        data_type: VARCHAR(1)
      - name: ts_deleted
        data_type: TIMESTAMP_NTZ
      - name: sys_change_operation
        data_type: VARCHAR
      - name: lastmodifieddata
        data_type: TIMESTAMP_NTZ
      - name: biradd_procedura
        data_type: VARCHAR(2)
      - name: biradd_pratica
        data_type: NUMBER(12,0)
      - name: biradd_progressivo
        data_type: NUMBER(3,0)
      - name: biradd_rata_teorica
        data_type: NUMBER(3,0)
      - name: biradd_importo_sb
        data_type: NUMBER(13,0)
      - name: biradd_importo_sc
        data_type: NUMBER(13,0)
      - name: biradd_data_add
        data_type: NUMBER(8,0)
      - name: biradd_rata_add
        data_type: NUMBER(3,0)
      - name: biradd_prg_add_sb
        data_type: NUMBER(5,0)
      - name: biradd_prg_add_sc
        data_type: NUMBER(5,0)
      - name: biradd_programma_add
        data_type: VARCHAR(10)
      - name: biradd_data_invio
        data_type: NUMBER(8,0)
      - name: biradd_dest_birlgt
        data_type: NUMBER(9,0)
      - name: biradd_progr_birlgt
        data_type: NUMBER(9,0)
      - name: rowid
        data_type: NUMBER(38, 0)
